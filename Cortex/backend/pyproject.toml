[project]
name = "cortex-backend"
version = "0.1.0"
description = "Cortex - AI-powered Polymarket forecasting backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.135.0",
    "uvicorn>=0.44.0",
    "sqlalchemy>=2.0.0",
    "asyncpg>=0.31.0",
    "alembic>=1.18.0",
    "APScheduler>=3.11.0,<4.0.0",
    "httpx>=0.28.0",
    "pydantic>=2.12.0",
    "pydantic-settings",
    "tavily-python>=0.7.23",
    "openrouter>=0.8.1",
    "PyJWT>=2.10.0",
    "bcrypt>=5.0.0",
    "cryptography>=45.0.0",
    "python-multipart>=0.0.20",
    "email-validator>=2.0.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[project.optional-dependencies]
dev = [
    "ruff>=0.15.0",
    "pytest",
    "pytest-asyncio",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
